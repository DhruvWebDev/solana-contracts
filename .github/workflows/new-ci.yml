name: Multisig CI

on:
  push:
    branches: [ "programs/multisig" ]
  pull_request:
    branches: [ "programs/multisig" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Solana Environment
        uses: DhruvWebDev/solana-setup-action@v2 # Replace with your repo
        with:
          node-version: '20'
          solana-cli-version: '1.18.18'
          anchor-version: '0.30.1'
          pnpm-package-manager: '8.15.5'
          yarn-package-manager: '1.22.19'

      - name: Verify Solana CLI version
        run: solana --version

      - name: Verify Anchor CLI version
        run: anchor --version

      - name: Install project dependencies
        run: npm install

      - name: Anchor Build
        run: anchor build

      - name: Anchor Test
        run: anchor test
